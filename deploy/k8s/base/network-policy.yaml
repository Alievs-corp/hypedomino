apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/part-of: hypedomino
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: debug
