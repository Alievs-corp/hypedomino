apiVersion: batch/v1
kind: CronJob
metadata:
  name: account-deletion
  labels:
    app.kubernetes.io/name: account-deletion
    app.kubernetes.io/part-of: hypedomino
spec:
  schedule: "23 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: account-deletion
            app.kubernetes.io/part-of: hypedomino
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: account-deletion
              image: hypedomino-server
              command: ["/account-deletion", "run"]
              envFrom:
                - secretRef:
                    name: account-deletion-env
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
