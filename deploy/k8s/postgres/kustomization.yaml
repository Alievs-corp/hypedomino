apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
configMapGenerator:
  - name: postgres-initdb
    files:
      - initdb/10-hypedomino.sh
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: hypedomino
images:
  - name: hypedomino-postgres-walg
    newName: ghcr.io/alievs-corp/hypedomino-postgres-walg
    newTag: 16-walg-v3.0.9
