apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hd-ci
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ghcr.io/alievs-corp/hypedomino-server
    newName: hypedomino-server
    newTag: ci
secretGenerator:
  - name: server-env
    literals:
      - HD_LOG_LEVEL=info
  - name: migrate-env
    literals:
      - HD_DATABASE_URL=postgres://postgres@postgres:5432/hypedomino?sslmode=disable
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: server.yaml
  - path: migrate.yaml
