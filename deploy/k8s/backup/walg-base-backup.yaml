apiVersion: batch/v1
kind: CronJob
metadata:
  name: walg-base-backup
  labels:
    app.kubernetes.io/name: walg
    app.kubernetes.io/part-of: hypedomino
spec:
  schedule: "17 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: walg
            app.kubernetes.io/part-of: hypedomino
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: postgres
          containers:
            - name: backup-push
              image: hypedomino-postgres-walg
              command: ["wal-g", "backup-push", "/var/lib/postgresql/data/pgdata"]
              envFrom:
                - configMapRef:
                    name: walg-config
                - secretRef:
                    name: walg-credentials
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: walg-credentials
                      key: PG_WALG_PASSWORD
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
                - name: socket
                  mountPath: /var/run/postgresql
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: postgres-data
            - name: socket
              emptyDir: {}
