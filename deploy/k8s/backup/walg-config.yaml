apiVersion: v1
kind: ConfigMap
metadata:
  name: walg-config
  labels:
    app.kubernetes.io/name: walg
    app.kubernetes.io/part-of: hypedomino
data:
  WALG_S3_PREFIX: s3://REPLACE-backup-bucket/postgres
  AWS_ENDPOINT: https://REPLACE-backup-endpoint
  AWS_S3_FORCE_PATH_STYLE: "true"
  AWS_REGION: eu-central
  WALG_COMPRESSION_METHOD: zstd
  WALG_LIBSODIUM_KEY_TRANSFORM: hex
  WALG_UPLOAD_CONCURRENCY: "4"
  WALG_DOWNLOAD_CONCURRENCY: "4"
  PGHOST: postgres.hypedomino.svc
  PGUSER: walg
  PGDATABASE: postgres
  PGSSLMODE: require
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-archive-config
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: hypedomino
data:
  postgresql-archive.conf: |
    wal_level = replica
    archive_mode = on
    archive_timeout = 60
    archive_command = 'wal-g wal-push %p'
