apiVersion: batch/v1
kind: CronJob
metadata:
  name: content-mirror
  labels:
    app.kubernetes.io/name: content-mirror
    app.kubernetes.io/part-of: hypedomino
spec:
  schedule: "23 4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: content-mirror
            app.kubernetes.io/part-of: hypedomino
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror
              image: rclone/rclone:1.69.1
              args: ["copy", "--immutable", "--no-traverse", "content:$(CONTENT_BUCKET)", "mirror:$(MIRROR_BUCKET)"]
              envFrom:
                - secretRef:
                    name: content-mirror-credentials
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
