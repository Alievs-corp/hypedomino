apiVersion: batch/v1
kind: CronJob
metadata:
  name: walg-retention
  labels:
    app.kubernetes.io/name: walg
    app.kubernetes.io/part-of: hypedomino
spec:
  schedule: "47 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: walg
            app.kubernetes.io/part-of: hypedomino
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: hypedomino-postgres-walg
              command: ["sh", "-c", "wal-g delete retain FULL 35 --confirm && wal-g backup-list"]
              envFrom:
                - configMapRef:
                    name: walg-config
                - secretRef:
                    name: walg-credentials
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
