name: Release build

on:
  workflow_dispatch:
    inputs:
      catalog_version:
        description: Catalog version this build carries, docs/content-delivery.md 2
        required: true
        type: string

permissions:
  contents: read

env:
  BUNDLETOOL_VERSION: 1.18.3
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
  INSTALL_SIZE_LIMIT_BYTES: 150000000
  AAB: build/Android/Android.aab
  REMOTE: client/ServerData/Android

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check the catalog version
        env:
          CATALOG_VERSION: ${{ inputs.catalog_version }}
        run: |
          [[ "$CATALOG_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || { echo "catalog_version must be 1 to 64 letters, digits, '.', '_' or '-' starting with a letter or digit"; exit 1; }
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: unity-library-android-release-${{ hashFiles('client/Packages/**', 'client/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-android-release-
      - uses: game-ci/unity-builder@v6
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          targetPlatform: Android
          androidExportType: androidAppBundle
          buildMethod: HypeDomino.Editor.ReleaseBuild.BuildAndroid
          customParameters: -catalogVersion ${{ inputs.catalog_version }}
          versioning: None
          allowDirtyBuild: true
      - name: Fail when the build did not finish
        env:
          CATALOG_VERSION: ${{ inputs.catalog_version }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" client build
          [ -f client/Logs/editor-method-succeeded ] || { echo "the release build did not finish; read the Unity log above"; exit 1; }
          [ -f "$AAB" ] || { echo "$AAB is missing"; exit 1; }
          [ -f "$REMOTE/catalog_$CATALOG_VERSION.bin" ] || { echo "the remote catalog is missing"; exit 1; }
          ls -l "$AAB" "$REMOTE"
      - name: Install bundletool
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Measure the install size
        id: size
        run: |
          sizes=()
          for tier in low mid high; do
            java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/$tier.apks" --device-spec="tools/install-size/specs/$tier.json" --overwrite
            java -jar "$RUNNER_TEMP/bundletool.jar" get-size total --apks="$RUNNER_TEMP/$tier.apks" > "$RUNNER_TEMP/$tier.csv"
            sizes+=("$tier=$RUNNER_TEMP/$tier.csv")
          done
          status=0
          node tools/install-size/install-size.mjs --limit-bytes "$INSTALL_SIZE_LIMIT_BYTES" --remote "$REMOTE" "${sizes[@]}" > install-size.md || status=$?
          cat install-size.md | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: success() || steps.size.outcome == 'failure'
        with:
          name: android-release-${{ inputs.catalog_version }}
          path: |
            ${{ env.AAB }}
            install-size.md
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() || steps.size.outcome == 'failure'
        with:
          name: content-android-${{ inputs.catalog_version }}
          path: ${{ env.REMOTE }}
          if-no-files-found: error
          retention-days: 14
