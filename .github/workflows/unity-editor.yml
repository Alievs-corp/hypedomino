name: Unity editor method

on:
  workflow_dispatch:
    inputs:
      method:
        description: Static editor method to run, HypeDomino.Editor.<Class>.<Method>
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the method name
        env:
          METHOD: ${{ inputs.method }}
        run: |
          [[ "$METHOD" =~ ^HypeDomino\.Editor\.[A-Za-z0-9]+\.[A-Za-z0-9]+$ ]] || { echo "method must be HypeDomino.Editor.<Class>.<Method>"; exit 1; }
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: unity-library-editor-${{ hashFiles('client/Packages/**', 'client/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-editor-
      - uses: game-ci/unity-builder@v6
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          targetPlatform: Android
          buildMethod: ${{ inputs.method }}
          versioning: None
          allowDirtyBuild: true
      - name: Collect the changes
        run: |
          sudo chown -R "$(id -u):$(id -g)" client
          git add -A client/Assets client/Packages client/ProjectSettings
          git diff --cached --binary -- client > editor-changes.patch
          git diff --cached --stat -- client
      - uses: actions/upload-artifact@v4
        with:
          name: editor-changes
          path: editor-changes.patch
          retention-days: 7
      - name: Fail when the method did not finish
        run: |
          [ -f client/Logs/editor-method-succeeded ] || { echo "the editor method did not finish; read the Unity log above"; exit 1; }
          [ -s editor-changes.patch ] || echo "the editor method changed nothing"
