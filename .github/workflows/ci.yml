name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.areas.outputs.server }}
      admin: ${{ steps.areas.outputs.admin }}
      client: ${{ steps.areas.outputs.client }}
      proto: ${{ steps.areas.outputs.proto }}
      proto_breaking: ${{ steps.areas.outputs.proto_breaking }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            admin:
              - 'admin/**'
              - '.github/workflows/ci.yml'
            client:
              - 'client/**'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'server/internal/pb/**'
              - 'client/Assets/HypeDomino/Generated/**'
              - 'admin/src/gen/**'
              - 'tools/proto-lint/**'
              - '.github/workflows/ci.yml'
      - id: areas
        env:
          SERVER_CHANGED: ${{ steps.filter.outputs.server }}
          ADMIN_CHANGED: ${{ steps.filter.outputs.admin }}
          CLIENT_CHANGED: ${{ steps.filter.outputs.client }}
          PROTO_CHANGED: ${{ steps.filter.outputs.proto }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          emit() {
            if [ "$2" = "true" ] && [ -f "$3" ]; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"
          }
          emit server "$SERVER_CHANGED" server/go.mod
          emit admin "$ADMIN_CHANGED" admin/package.json
          emit client "$CLIENT_CHANGED" client/ProjectSettings/ProjectVersion.txt
          emit proto "$PROTO_CHANGED" proto/buf.yaml
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:proto/buf.yaml" 2>/dev/null; then
            echo "proto_breaking=true" >> "$GITHUB_OUTPUT"
          else
            echo "proto_breaking=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run lint
      - run: npm run test:tools

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan the pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="${merge_base}..${HEAD_SHA}" .
      - name: Scan the full history
        if: github.event_name != 'pull_request'
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  pr-meta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=""
          for prefix in "type:" "area:" "priority:"; do
            echo "$LABELS" | jq -e --arg p "$prefix" 'any(.[]; startswith($p))' >/dev/null || missing="$missing $prefix"
          done
          if [ -n "$missing" ]; then
            echo "Missing labels:$missing"
            exit 1
          fi
          if ! printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves|part of) #[0-9]+'; then
            echo "PR body must link its issue with 'Closes #N' or 'Part of #N'"
            exit 1
          fi
          echo "Labels and issue link present"

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Rules coverage floor
        run: |
          rules=$(go tool cover -func=coverage.out | awk '$1 ~ /internal\/rules\// {total += 1} END {print total}')
          percent=$(go test -cover ./internal/rules/ | grep -o 'coverage: [0-9.]*' | grep -o '[0-9.]*')
          echo "server/internal/rules coverage: ${percent}% (${rules} functions)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v p="$percent" 'BEGIN { exit (p + 0 >= 95) ? 0 : 1 }' || { echo "rules coverage ${percent}% is below the 95% floor of docs/test-strategy.md section 11"; exit 1; }

  bench:
    needs: changes
    if: needs.changes.outputs.server == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Benchmark this branch
        run: go test -run='^$' -bench=. -benchmem -count=6 ./internal/rules/ | tee new.txt
      - name: Benchmark main
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          if [ -d ../base/server/internal/rules ]; then
            (cd ../base/server && go test -run='^$' -bench=. -benchmem -count=6 ./internal/rules/) | tee old.txt
          else
            echo "no rules package on the base" | tee old.txt
          fi
      - name: benchstat against main
        run: |
          go run golang.org/x/perf/cmd/benchstat@latest old.txt new.txt | tee benchstat.txt || true
          { echo '## Benchmarks against main (report only)'; echo '```'; cat benchstat.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present test
      - run: pnpm run build

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: unity-library-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: unity-library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          testMode: all

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint proto
      - run: buf format --diff --exit-code proto
      - if: github.event_name == 'pull_request' && needs.changes.outputs.proto_breaking == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: buf breaking proto --against ".git#ref=${BASE_SHA},subdir=proto"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/proto-lint/proto-lint.mjs proto
      - run: buf generate proto --template proto/buf.gen.yaml
      - name: generated code is current
        run: |
          drift=$(git status --porcelain -- server/internal/pb client/Assets/HypeDomino/Generated admin/src/gen)
          [ -z "$drift" ] || { echo "$drift"; echo "generated code differs from proto/, run npm run proto:gen and commit"; exit 1; }

  ci-complete:
    name: CI complete
    if: always()
    needs: [changes, lint, secret-scan, pr-meta, server, admin, client, proto]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          not_ok=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          must_run=$(echo "$RESULTS" | jq -r '[.changes.result, .lint.result, .["secret-scan"].result] | map(select(. != "success")) | length')
          if [ -n "$not_ok" ] || [ "$must_run" != "0" ]; then
            echo "Failed or cancelled: ${not_ok:-changes/lint/secret-scan did not succeed}"
            exit 1
          fi
