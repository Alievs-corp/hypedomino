name: Server image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'tools/deploy/container-smoke.sh'
      - '.github/workflows/server-image.yml'
  pull_request:
    paths:
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alievs-corp/hypedomino-server
  STABLE_TAG: main

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.description=hypedomino game server, docs/launch-runbook.md 5.1" \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:$STABLE_TAG" server
      - name: Container health, bad config exit and SIGTERM drain
        run: bash tools/deploy/container-smoke.sh "$IMAGE:$GITHUB_SHA"
      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$STABLE_TAG"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "Pushed $digest, tags $GITHUB_SHA and $STABLE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
