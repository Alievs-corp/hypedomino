version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/Alievs-corp/hypedomino/server/internal/pb
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: server/internal/pb
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/csharp:v36.2
    out: client/Assets/HypeDomino/Generated/Proto
  - remote: buf.build/bufbuild/es:v2.16.0
    out: admin/src/gen/proto
    opt: target=ts
