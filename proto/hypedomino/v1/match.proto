syntax = "proto3";

package hypedomino.v1;

enum BoardEnd {
  BOARD_END_UNSPECIFIED = 0;
  BOARD_END_LEFT = 1;
  BOARD_END_RIGHT = 2;
  BOARD_END_TOP = 3;
  BOARD_END_BOTTOM = 4;
}

enum Seat {
  SEAT_UNSPECIFIED = 0;
  SEAT_NORTH = 1;
  SEAT_EAST = 2;
  SEAT_SOUTH = 3;
  SEAT_WEST = 4;
  SEAT_X = 5;
  SEAT_Y = 6;
}

enum Team {
  TEAM_UNSPECIFIED = 0;
  TEAM_A = 1;
  TEAM_B = 2;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_1V1 = 1;
  MODE_2V2 = 2;
}

enum Controller {
  CONTROLLER_UNSPECIFIED = 0;
  CONTROLLER_PLAYER = 1;
  CONTROLLER_BOT = 2;
}

enum MatchState {
  MATCH_STATE_UNSPECIFIED = 0;
  MATCH_STATE_WAITING = 1;
  MATCH_STATE_OPENING = 2;
  MATCH_STATE_PLAYING = 3;
  MATCH_STATE_FINISHED = 4;
  MATCH_STATE_LOADING = 5;
}

message Tile {
  uint32 low = 1;
  uint32 high = 2;
}

message PlaceTileIntent {
  Tile tile = 1;
  BoardEnd end = 2;
}

message PassIntent {}

message DrawIntent {}

message EndTurnIntent {}

message LoadingIntent {
  uint32 progress = 1;
  bool ready = 2;
}

message OrientedTile {
  uint32 first = 1;
  uint32 second = 2;
}

message OpenEnd {
  BoardEnd end = 1;
  uint32 value = 2;
}

message BoardView {
  repeated OrientedTile line = 1;
  Tile spinner = 2;
  repeated OrientedTile top = 3;
  repeated OrientedTile bottom = 4;
  repeated OpenEnd open_ends = 5;
}

message SeatView {
  Seat seat = 1;
  uint32 hand_size = 2;
  Controller controller = 3;
  uint32 loading_progress = 4;
  bool ready = 5;
}

message LegalMove {
  Tile tile = 1;
  BoardEnd end = 2;
}

message Opening {
  Seat seat = 1;
  Tile tile = 2;
}

message TeamPoints {
  uint32 team_a = 1;
  uint32 team_b = 2;
}

message HandResult {
  TeamPoints pips = 1;
  Team winner = 2;
  TeamPoints awarded = 3;
  uint32 carry_over = 4;
  TeamPoints scores = 5;
  Team next_opener = 6;
}

message RosterEntry {
  Seat seat = 1;
  Team team = 2;
  string nickname = 3;
  string character = 4;
  string frame = 5;
  string avatar = 6;
  string rank_label = 7;
  repeated string emblems = 8;
  bool bot = 9;
}

message MatchView {
  MatchState state = 1;
  Seat seat = 2;
  Mode mode = 3;
  uint32 hands_played = 4;
  TeamPoints scores = 5;
  uint32 carry_over = 6;
  repeated Tile hand = 7;
  repeated SeatView seats = 8;
  uint32 boneyard_size = 9;
  BoardView board = 10;
  Seat current = 11;
  Team opening_team = 12;
  Opening forced_opening = 13;
  uint32 turn_placements = 14;
  uint64 turn_deadline_unix_ms = 15;
  repeated LegalMove legal_moves = 16;
  HandResult last_result = 17;
  Team winner = 18;
  repeated RosterEntry roster = 19;
  uint64 loading_deadline_unix_ms = 20;
  string table = 21;
}
